{% load staticfiles %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
      {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}" />
  </head>
  <body>
    {% block header %}
      <h1>Mi sitio</h1>
    {% endblock %}

    {% block content %}
    {% endblock %}

    {% block footer %}
      <p>Gracias por visitar mi sitio web</p>
    {% endblock %}
  </body>
</html>
